name: TEZVPN
options:
  bundleIdPrefix: ru.tezvpn
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true
settings:
  base:
    DEVELOPMENT_TEAM: ""
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
packages:
  WireGuardKit:
    url: https://github.com/amnezia-vpn/amneziawg-apple
    branch: master
targets:
  TEZVPN:
    type: application
    platform: iOS
    sources:
      - TEZVPN
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.tezvpn.app
        INFOPLIST_FILE: TEZVPN/Info.plist
        CODE_SIGN_ENTITLEMENTS: TEZVPN/TEZVPN.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: TEZVPNTunnel
        embed: true
        codeSign: true
    entitlements:
      path: TEZVPN/TEZVPN.entitlements
  TEZVPNTunnel:
    type: app-extension
    platform: iOS
    sources:
      - TEZVPNTunnel
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.tezvpn.app.tunnel
        INFOPLIST_FILE: TEZVPNTunnel/Info.plist
        CODE_SIGN_ENTITLEMENTS: TEZVPNTunnel/TEZVPNTunnel.entitlements
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
    dependencies:
      - package: WireGuardKit
        product: WireGuardKit
    entitlements:
      path: TEZVPNTunnel/TEZVPNTunnel.entitlements
schemes:
  TEZVPN:
    build:
      targets:
        TEZVPN: all
        TEZVPNTunnel: all
    run:
      config: Debug
