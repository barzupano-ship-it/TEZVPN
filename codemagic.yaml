workflows:
  tezv-android:
    name: TEZVPN Android
    max_build_duration: 60
    instance_type: linux_x2
    working_directory: flutter
    environment:
      android_signing:
        - tezv_android
      groups:
        - google_play
      flutter: stable
    scripts:
      - name: Flutter packages
        script: flutter pub get
      - name: Android App Bundle
        script: flutter build appbundle --release
    artifacts:
      - flutter/build/app/outputs/bundle/release/*.aab
    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
        submit_as_draft: true

  tezv-ios:
    name: TEZVPN iOS
    max_build_duration: 120
    instance_type: mac_mini_m2
    working_directory: flutter
    integrations:
      app_store_connect: tezv_app_store
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Set up keychain
        script: keychain initialize
      - name: Fetch signing files
        script: |
          app-store-connect fetch-signing-files "ru.tezvpn.app" --type IOS_APP_STORE --create
          app-store-connect fetch-signing-files "ru.tezvpn.app.tunnel" --type IOS_APP_STORE --create
      - name: Set up signing certificate
        script: keychain add-certificates
      - name: Flutter packages
        script: flutter pub get
      - name: Build AmneziaWG
        script: bash ios/scripts/prepare_amneziawg.sh
      - name: Apply provisioning profiles
        script: xcode-project use-profiles
      - name: iOS IPA
        script: flutter build ipa --release --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - flutter/build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
