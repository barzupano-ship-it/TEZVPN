workflows:
  tezv-android:
    name: TEZVPN Android
    max_build_duration: 60
    instance_type: mac_mini_m2
    working_directory: flutter
    environment:
      android_signing:
        - tezv_android
      flutter: stable
    scripts:
      - name: Flutter packages
        script: flutter pub get
      - name: Android packages
        script: |
          flutter build appbundle --release
          flutter build apk --release
    artifacts:
      - build/app/outputs/bundle/release/*.aab
      - build/app/outputs/flutter-apk/*.apk

  tezv-ios:
    name: TEZVPN iOS
    max_build_duration: 120
    instance_type: mac_mini_m2
    working_directory: flutter
    integrations:
      app_store_connect: tezv_app_store
    environment:
      groups:
        - ios_signing
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Set up keychain
        script: keychain initialize
      - name: Fetch signing files
        script: |
          if [ -z "$CERTIFICATE_PRIVATE_KEY" ]; then
            echo "Set CERTIFICATE_PRIVATE_KEY in Codemagic environment variables"
            exit 1
          fi
          KEY=/tmp/asc_cert_key.pem
          if printf '%s' "$CERTIFICATE_PRIVATE_KEY" | grep -q "BEGIN"; then
            printf '%s\n' "$CERTIFICATE_PRIVATE_KEY" > "$KEY"
          else
            printf '%s' "$CERTIFICATE_PRIVATE_KEY" | tr -d ' \r\n' | base64 --decode > "$KEY"
          fi
          openssl rsa -in "$KEY" -check -noout
          app-store-connect fetch-signing-files "ru.tezvpn.app" \
            --type IOS_APP_STORE --create --strict-match-identifier \
            --certificate-key=@file:$KEY
          app-store-connect fetch-signing-files "ru.tezvpn.app.tunnel" \
            --type IOS_APP_STORE --create --strict-match-identifier \
            --certificate-key=@file:$KEY
      - name: Set up signing certificate
        script: keychain add-certificates
      - name: Flutter packages
        script: flutter pub get
      - name: Build AmneziaWG
        script: bash ios/scripts/prepare_amneziawg.sh
      - name: Apply provisioning profiles
        script: |
          echo "Profiles:"
          ls -la "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles" 2>/dev/null || true
          ls -la "$HOME/Library/MobileDevice/Provisioning Profiles" 2>/dev/null || true
          security find-identity -v -p codesigning
          xcode-project use-profiles --verbose --project ios/Runner.xcodeproj
          test -f /Users/builder/export_options.plist || {
            echo "use-profiles did not write export_options.plist"
            exit 1
          }
      - name: iOS IPA
        script: |
          flutter build ipa --release \
            --build-number="$BUILD_NUMBER" \
            --export-options-plist=/Users/builder/export_options.plist
          ls -la build/ios/ipa
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
